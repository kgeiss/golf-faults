<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faults">
<title>Faults</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --ink:#1C2321; --muted:#5B6360; --faint:#7C827F;
  --rule:#D9D3C7; --rule2:#ECE7DD; --green:#1F5C43; --green-soft:#E4EEE8; --green-line:#BFD6C8;
  --orange:#C2410C; --orange-soft:#FBEDE5; --orange-line:#E9B79C; --orange-ink:#8A3410;
  --panel:#FDF8F4; --disabled:#EFEBE3; --track:#E6E0D4;
  --num:'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
a{color:var(--green)}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.num{font-family:var(--num);font-weight:700}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.section{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(12px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-family:var(--num);font-weight:700;font-size:30px;line-height:1}
.iconbtn{height:44px;min-width:44px;padding:0 12px;border:1px solid var(--rule);background:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.btn{height:52px;border-radius:14px;border:1px solid var(--rule);background:#fff;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:#A12A0A;border-color:var(--orange-line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{height:48px;border:1px solid var(--rule);border-radius:12px;background:#fff;padding:0 14px;font-size:16px;width:100%}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.seg{display:grid;gap:6px}
.seg button{height:48px;border-radius:12px;border:1px solid var(--rule);background:#fff;font-weight:600}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.item{width:100%;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:60px}
.item.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.item .grow{flex:1 1 auto;min-width:0}
.item .t{font-weight:600;font-size:15px}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:6px;padding:3px 7px;white-space:nowrap}
.pill.green{color:var(--green);background:var(--green-soft)}
.pill.orange{color:var(--orange-ink);background:var(--orange-soft)}
.pill.gray{color:var(--muted);background:var(--disabled)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.err{background:var(--orange-soft);border:1px solid var(--orange-line);color:var(--orange-ink);border-radius:12px;padding:10px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.tile.warm{background:var(--orange-soft);border-color:var(--orange-line)}
.tile .k{font-size:12px;color:var(--muted)}
.tile.warm .k,.tile.warm .u{color:var(--orange-ink)}
.tile .v{font-family:var(--num);font-weight:700;font-size:40px;line-height:1.05}
.tile.warm .v{color:var(--orange)}
.tile .u{font-size:12px;color:var(--muted)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button.on{color:var(--ink)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--rule);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.navbar .in{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.navbar .btn{font-size:17px}
/* hole screen */
.holehead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding-top:12px}
.holeno{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;text-align:center}
.holemeta{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.holemeta strong{color:var(--ink)}
.strip{display:grid;gap:2px;margin-top:12px}
.strip button{height:24px;padding:0;border-radius:4px;border:1px solid var(--rule);background:transparent;color:var(--faint);font-size:10px;font-weight:600}
.strip .done{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.strip .bad{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-line)}
.strip .cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.scores{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sbtn{height:56px;padding:0;border-radius:12px;border:1px solid var(--rule);background:#fff;font-family:var(--num);font-weight:700;font-size:26px;line-height:1}
.sbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.high{padding:10px;border-radius:12px;background:var(--green-soft);border:1px solid var(--green-line);display:flex;flex-direction:column;gap:6px}
.high .lbl{font-size:12px;font-weight:600;color:var(--green)}
.high .sbtn{height:44px;font-size:22px;border-radius:10px}
.fault{display:flex;flex-direction:column}
.frow{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--rule);background:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;text-align:left}
.frow.on{background:var(--orange-soft);border-color:var(--orange-line);border-radius:12px 12px 0 0}
.frow:disabled:not(.on){background:var(--disabled)}
.frow:disabled:not(.on) .ft{color:var(--faint)}
.box{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid #9A9284;background:#fff;display:flex;align-items:center;justify-content:center}
.frow:disabled:not(.on) .box{border-color:var(--rule)}
.frow.on .box{background:var(--orange);border-color:var(--orange)}
.ftext{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;min-width:0}
.ft{font-size:15px;font-weight:600}
.fs{font-size:12px;color:var(--muted)}
.panel{padding:12px;border:1px solid var(--orange-line);border-top:none;border-radius:0 0 12px 12px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.plabel{font-size:12px;font-weight:600;color:var(--orange-ink)}
.slabel{font-size:12px;font-weight:600;color:var(--muted)}
.note{font-size:12px;color:var(--green);background:var(--green-soft);border-radius:8px;padding:6px 10px}
.grp{display:flex;flex-direction:column;gap:6px}
.l1{display:flex;gap:6px}
.l1 .chip{flex:1 1 0;min-width:0;height:44px;border-radius:22px;font-weight:600;font-size:14px;padding:0 4px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.on.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.linked{background:var(--green-soft);color:var(--green);border-color:#8FB5A0}
.sect{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid #EED9CB}
.sect.first{padding-top:0;border-top:none}
.srow{display:flex;gap:12px;align-items:flex-start}
.opts{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 0;min-width:0;align-content:flex-start}
.odir{display:flex;align-items:center;gap:12px;padding-top:4px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;flex:none}
.pad button{width:44px;height:44px;padding:0;border-radius:10px;border:1px solid var(--rule);background:#fff;display:flex;align-items:center;justify-content:center}
.pad button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pdot{display:flex;align-items:center;justify-content:center}
.pdot::after{content:"";width:8px;height:8px;border-radius:4px;background:#B8B0A2}
/* summary */
.sc{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;font-size:13px;table-layout:fixed}
.sc th,.sc td{text-align:center;padding:6px 0;border-top:1px solid var(--rule2)}
.sc tr:first-child th{background:#EFEBE3;color:var(--muted);font-size:11px;border-top:none}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:8px;width:52px;font-size:12px;color:var(--muted);font-weight:600}
.sc .flt td{background:#FDF8F4}
.sc .flt td:first-child{color:var(--orange-ink)}
.sc .over{font-weight:700}
.sc .under{color:var(--green);font-weight:600}
.sc .fz{color:var(--orange);font-weight:700}
.sc .dot{color:#B8B0A2}
/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.4em;align-items:center;gap:10px}
.bar .l{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.bar .fl{height:10px;background:var(--orange);border-radius:0 4px 4px 0;min-width:2px}
.bar .n{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.bar .n small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sub{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.subh{display:flex;justify-content:space-between;align-items:baseline}
.subh .t{font-weight:600}
.minis{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.mini{display:flex;flex-direction:column;gap:6px;flex:1 1 140px;min-width:0}
.compass{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,34px);gap:2px;flex:none}
.compass span{display:flex;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.compass .z{color:#B8B0A2;font-weight:500}
.compass .c{font-size:10px;color:var(--muted);font-weight:500}
.takeaway{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.takeaway::before{content:"";flex:none;width:6px;height:6px;border-radius:3px;background:var(--orange);margin-top:8px}
.chart{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px 12px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}
.chart .tip strong{color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .chip.on{background:var(--ink);border-color:var(--ink)}
.select{height:40px;border:1px solid var(--rule);border-radius:20px;background:#fff;padding:0 12px;font-size:13px;max-width:100%}
.pie{display:flex;align-items:center;gap:16px}
.pie svg{flex:none}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:8px;align-items:center;font-size:14px}
.lg .sw{width:12px;height:12px;border-radius:3px}
.lg .ll{font-weight:500}
.lg .lp{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lg .lc{grid-column:2 / 4;font-size:11px;color:var(--muted);margin-top:-2px}
.lg.z{opacity:.45}
.card .tip{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}
.odiv{flex-basis:100%;height:1px;background:#E2CDBE;margin:2px 0}
.g1,.g2,.g3{flex-basis:100%;display:grid;gap:6px}
.g1{grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g1 .chip,.g2 .chip,.g3 .chip{padding:0 4px;white-space:nowrap}
.tcard{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tname{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.tname .sw{width:10px;height:10px;border-radius:3px}
.tcount{display:flex;align-items:baseline;gap:6px}
.tcount .tsub{font-size:12px;color:var(--muted);text-align:right}
.tcount .num{font-size:40px;line-height:1;color:var(--orange)}
.tsect{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule2);padding-top:12px}
.tsect.first{border-top:none;padding-top:0}
.tsname{font-weight:600;font-size:15px}
.pills{display:grid;gap:6px;font-size:12px;text-align:center}
.pills span{padding:5px 0;border-radius:10px;background:var(--disabled);color:var(--faint)}
.pills span.w{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.compass span.w{color:var(--orange)}
.st{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}
.st th,.st td{text-align:center;padding:8px 2px;border-top:1px solid var(--rule2)}
.st thead th{border-top:none;font-size:11px;font-weight:600;color:var(--muted);padding-top:2px}
.st th[scope=row]{text-align:left;padding-left:6px;font-weight:600;width:44px}
.st thead th:first-child{text-align:left;padding-left:6px;width:44px}
.st td.v{font-weight:700;color:var(--orange)}
.st td.z{color:#B8B0A2}
.st td.na{color:#D9D3C7}
.st td.tot{font-weight:700;background:var(--panel)}
.st td.tot small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.st tr.foot th,.st tr.foot td{border-top:2px solid var(--rule);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" tabindex="-1">
<script>
(function () {

/* ---------------- helpers ---------------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function now() { return new Date().toISOString(); }

  var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]);
  var o = { month: 'short', day: 'numeric' }; if (withYear) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function rel(v) { return v == null ? '–' : v > 0 ? '+' + v : v === 0 ? 'E' : String(v); }
function relDec(v) { if (v == null || isNaN(v)) return '–'; var r = Math.round(v * 10) / 10; return r > 0 ? '+' + r.toFixed(1) : r === 0 ? 'E' : r.toFixed(1); }
function dec(v, n) { if (v == null || isNaN(v)) return '–'; return (Math.round(v * Math.pow(10, n || 1)) / Math.pow(10, n || 1)).toFixed(n == null ? 1 : n); }
function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '–'; }
function range(a, b) { var o = []; for (var i = a; i <= b; i++) o.push(i); return o; }
function svgArrow(p) { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + p + '"></path></svg>'; }
var ICON = {

/* ---------------- storage ---------------- */

/* ---------------- hole logic ---------------- */

// Scoring approach only when Missed; Two chip and Three putt once per hole.

    var t = s['trouble.' + sh[0]] && s['trouble.' + sh[0] + '.type'];
    if (t) out.push({ type: t === 'pen' ? 'penalty' : 'recovery', shot: sh[0] });

  if (on.app150 && s['app150.green'] === 'miss') out.push({ type: 'scoring' });

}

function blankHole(n, th) {

    SHOTS.forEach(function (sh) {
      var k = 'trouble.' + sh[0];

      var parts = [sh[1]];
      var ds = dirsOf(h, k).map(function (d) { return DIRW[d]; });
      if (ds.length) parts.push(ds.join('/'));

      var sh2 = SHAPES.filter(function (x) { return s[k + '.' + x[0]]; }).map(function (x) { return x[1].toLowerCase(); });

function apiGet(path) {

    if (r.status === 401 || r.status === 403) throw new Error('The course service rejected your API key. Check it in Settings.');

    if (!r.ok) throw new Error('Course service error (' + r.status + ').');

}

  var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trend chart">';
  for (var v = lo; v <= hi + 1e-9; v += step) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (Math.abs(v) < 1e-9 ? '#B8B0A2' : '#ECE7DD') + '" stroke-width="1"></line>';
    s += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#5B6360">' + yLabelFmt(v) + '</text>';
  }
  var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1); }).join(' ');
  s += '<path d="' + path + '" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>';
  pts.forEach(function (p, i) { s += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="4" fill="#C2410C" stroke="#FFFFFF" stroke-width="2"></circle>'; });
  pts.forEach(function (p, i) { s += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="14" fill="transparent" data-tip="' + esc(p.tip) + '" data-tipfor="' + id + '" style="cursor:pointer"></circle>'; });
  s += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="#5B6360">' + esc(pts[0].x) + '</text>';
  if (pts.length > 1) s += '<text x="' + (W - R) + '" y="' + (H - 6) + '" font-size="11" fill="#5B6360" text-anchor="end">' + esc(pts[pts.length - 1].x) + '</text>';
  s += '</svg>';
  return '<div class="chart">' + s + '<div class="tip" id="' + id + '">Tap a point for details</div></div>';
}

function insightsBody(rs, opt) {
  var h = '', trouble = opt.course && opt.course !== 'all';
  var holes = [], nf = 0, clean = 0, score = 0, faultHoleScore = 0, cleanScore = 0, faultHoles = 0;
  var byPar = { 3: { h: 0, f: 0 }, 4: { h: 0, f: 0 }, 5: { h: 0, f: 0 } };
  var holeKey = {};
  rs.forEach(function (r) {
    playedHoles(r).forEach(function (x) {
      x._rid = r.id;
      holes.push(x);
      var c = faultCount(x);
      nf += c; score += x.delta;
      if (c) { faultHoles++; faultHoleScore += x.delta; } else { clean++; cleanScore += x.delta; }
      if (byPar[x.par]) { byPar[x.par].h++; byPar[x.par].f += c; }
      if (trouble) { var hk = holeKey[x.n] || (holeKey[x.n] = { n: x.n, par: x.par, plays: 0, f: 0, s: 0 }); hk.plays++; hk.f += c; hk.s += x.delta; }
    });

    (opt.round ? '<div class="tile warm"><div class="k">Faults</div><div class="v">' + nf + '</div><div class="u">on ' + faultHoles + ' hole' + (faultHoles === 1 ? '' : 's') + '</div></div>'

    (opt.round ? '<div class="tile"><div class="k">Score to par</div><div class="v">' + rel(score) + '</div><div class="u">' + n + ' holes</div></div>'
      : '<div class="tile"><div class="k">Score per 18</div><div class="v">' + relDec(score / n * 18) + '</div><div class="u">to par</div></div>') +
    '<div class="tile"><div class="k">Clean holes</div><div class="v">' + pct(clean, n) + '</div><div class="u">' + clean + ' of ' + n + '</div></div>' +
    '<div class="tile"><div class="k">Over par from fault holes</div><div class="v">' + (score > 0 ? pct(Math.max(faultHoleScore, 0), score) : '–') + '</div><div class="u">' + rel(faultHoleScore) + ' of ' + rel(score) + '</div></div></div></div>';

  // takeaways
  var counts = FTYPES.map(function (f, i) { return { f: f, n: C[f.id].n, i: i }; });
  var sorted = counts.slice().sort(function (a, b) { return b.n - a.n || a.i - b.i; });
  var tk = [];

  if (nf && sorted[0].n) tk.push((opt.round ? 'Your most common fault this round was ' : 'Your most common fault is ') + '<strong>' + sorted[0].f.label + '</strong>: ' + sorted[0].n + ' of ' + nf + ' faults.');
  if (faultHoles && clean) tk.push('Fault holes average <strong>' + relDec(faultHoleScore / faultHoles) + '</strong> to par; clean holes average <strong>' + relDec(cleanScore / clean) + '</strong>.');
  var td = {}, tdn = 0;
  ['penalty', 'recovery'].forEach(function (id) { Object.keys(C[id].shots).forEach(function (k) { var S = C[id].shots[k]; Object.keys(S.dirs).forEach(function (d) { td[d] = (td[d] || 0) + S.dirs[d]; tdn += S.dirs[d]; }); }); });
  var tdTop = Object.keys(td).sort(function (a, b) { return td[b] - td[a]; })[0];
  if (tdn >= 3 && tdTop && td[tdTop] / tdn > 0.5) tk.push('Your penalty and recovery misses lean <strong>' + DIRW[tdTop] + '</strong> (' + td[tdTop] + ' of ' + tdn + ' marked).');
  if (C.scoring.logged >= 3) tk.push('You hit <strong>' + C.scoring.hit + ' of ' + C.scoring.logged + ' (' + Math.round(C.scoring.hit / C.scoring.logged * 100) + '%)</strong> logged greens from 150 yds in.');

  // faults by type

  }

  if (trs.length >= 2) {
    var tp = trs.map(function (r) { var s = roundStats(r); return { x: fmtDate(r.date), y: s.faults / s.played * 18, tip: fmtDate(r.date, true) + ' · ' + (r.courseName || 'Round') + ' · ' + s.faults + ' fault' + (s.faults === 1 ? '' : 's') + ' in ' + s.played + ' holes (' + dec(s.faults / s.played * 18) + ' per 18)' }; });
    var sp = trs.map(function (r) { var s = roundStats(r); return { x: fmtDate(r.date), y: s.score / s.played * 18, tip: fmtDate(r.date, true) + ' · ' + (r.courseName || 'Round') + ' · ' + rel(s.score) + ' in ' + s.played + ' holes (' + relDec(s.score / s.played * 18) + ' per 18)' }; });

    h += '<div class="section"><div class="cap">Score to par per 18, by round</div>' + lineChart('tipS', sp, function (v) { return v > 0 ? '+' + v : v === 0 ? 'E' : String(v); }) + '</div>';
  } else if (!opt.round) {
    h += '<div class="section"><div class="hint">Trends over time appear after two rounds of 9+ holes.</div></div>';
  }

  // by par (all rounds only)
  var parRows = [3, 4, 5].filter(function (p) { return byPar[p].h; });
  if (!opt.round && parRows.length) h += '<div class="section"><div class="cap">Faults per hole by par</div><div class="card">' + barsHTML(parRows.map(function (p) { return { label: 'Par ' + p, n: +dec(byPar[p].f / byPar[p].h, 2), sub: byPar[p].h + ' holes' }; })) + '</div></div>';

  // trouble holes

    var th = Object.keys(holeKey).map(function (k) { return holeKey[k]; }).filter(function (x) { return x.f; }).sort(function (a, b) { return b.f / b.plays - a.f / a.plays || b.plays - a.plays; }).slice(0, 5);
    if (th.length) h += '<div class="section"><div class="cap">Trouble holes here</div><div class="card">' + barsHTML(th.map(function (x) { return { label: 'Hole ' + x.n + (x.par ? ' · par ' + x.par : ''), n: +dec(x.f / x.plays, 2), sub: x.plays + ' play' + (x.plays === 1 ? '' : 's') + ' · ' + relDec(x.s / x.plays) }; })) + '</div><div class="hint">Faults per time played.</div></div>';
  }

  // by shot type
  if (nf) h += shotTableHTML(C, nf);

  // by fault type
  var cards = typeCardsHTML(C, opt, n);
  if (cards) h += '<div class="section"><div class="cap">By fault type</div>' + cards + '</div>';
  holes.forEach(function (x) { delete x._rid; });
  return h;
}

/* ---------------- sync ---------------- */
function portable() { return { v: 2, exportedAt: now(), rounds: db.rounds, deleted: db.deleted, courses: db.courses }; }
function mergeIn(other) {
  if (!other || typeof other !== 'object') throw new Error('That file doesn’t look like Faults data.');
  var del = Object.assign({}, db.deleted);
  Object.keys(other.deleted || {}).forEach(function (k) { if (!del[k] || other.deleted[k] > del[k]) del[k] = other.deleted[k]; });
  var map = {};
  db.rounds.concat(other.rounds || []).forEach(function (r) {
    if (!normRound(r)) return;
    var cur = map[r.id];
    if (!cur || (r.updatedAt || '') > (cur.updatedAt || '')) map[r.id] = r;
  });
  db.rounds = Object.keys(map).map(function (k) { return map[k]; }).filter(function (r) { return !(del[r.id] && del[r.id] >= (r.updatedAt || '')); });
  db.deleted = del;
  Object.keys(other.courses || {}).forEach(function (k) { if (!db.courses[k]) db.courses[k] = other.courses[k]; });
  if (db.activeId && !roundById(db.activeId)) db.activeId = null;
  save();
}
function gh(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + db.settings.gistToken.trim(), Accept: 'application/vnd.github+json' }, opts.headers || {});
  return fetch('https://api.github.com' + path, opts).then(function (r) {
    if (r.status === 401) throw new Error('GitHub rejected the token.');
    if (r.status === 404) throw new Error('Gist not found. Check the Gist ID, or clear it to create a new one.');
    if (!r.ok) throw new Error('GitHub error (' + r.status + ').');
    return r.json();
  }, function () { throw new Error('Couldn’t reach GitHub. Check your connection.'); });
}
function syncNow(quiet) {
  var S = db.settings;
  if (!S.gistToken) return Promise.reject(new Error('Add a GitHub token first.'));
  var id = (S.gistId || '').trim();
  var pull = id ? gh('/gists/' + id).then(function (g) {
    var f = g.files && g.files[GIST_FILE];
    if (!f) return null;
    if (f.truncated && f.raw_url) return fetch(f.raw_url).then(function (r) { return r.json(); });
    return JSON.parse(f.content || 'null');
  }) : Promise.resolve(null);
  return pull.then(function (remote) {
    if (remote) mergeIn(remote);
    var body = JSON.stringify({ description: 'Faults golf app backup', files: (function () { var o = {}; o[GIST_FILE] = { content: JSON.stringify(portable()) }; return o; })() });
    if (id) return gh('/gists/' + id, { method: 'PATCH', body: body });
    var b = JSON.parse(body); b.public = false;
    return gh('/gists', { method: 'POST', body: JSON.stringify(b) });
  }).then(function (g) {
    if (g && g.id) S.gistId = g.id;
    S.lastSync = now(); save();
    if (!quiet) toast('Synced ' + db.rounds.length + ' round' + (db.rounds.length === 1 ? '' : 's') + '.');
  });
}

/* ---------------- actions ---------------- */
function curRound() { return roundById(ui.roundId); }
function curHole() { var r = curRound(); return r ? r.holes[r.cur || 0] : null; }

  var S = ui.setup;
  S.course = c;
  try { c._usedAt = now(); cacheCourse(c); } catch (e) { /* caching is optional */ }
  S.step = 'tees'; render(); window.scrollTo(0, 0);
}
var ACTIONS = {
  tab: function (d) { go(d.s); },
  newRound: function () { go('setup', { setup: { step: 'search', query: '', results: null, loading: false, error: '', course: null, tee: null, side: '18', date: todayISO(), manualName: '' } }); },
  resume: function () { go('hole', { roundId: db.activeId }); },
  openRound: function (d) { var r = roundById(d.id); if (!r) return; if (!r.finished) { db.activeId = r.id; save(); go('hole', { roundId: r.id }); } else go('summary', { roundId: r.id, view: 'insights', from: ui.screen === 'home' ? 'home' : 'rounds' }); },
  setupBack: function () {
    var S = ui.setup;

    else if (S.step === 'tees') { S.step = 'search'; render(); }
    else go('home');
  },
  search: function () {
    var qEl = document.getElementById('q');
    if (qEl && qEl.blur) qEl.blur();
    var S = ui.setup, q = (qEl || {}).value || '';
    S.query = q.trim();
    if (!S.query) { S.error = 'Type a course or club name.'; render(); return; }
    S.loading = true; S.error = ''; render();
    apiGet('/search?search_query=' + encodeURIComponent(S.query)).then(function (data) {
      S.results = (data && (data.courses || data.results)) || [];
    }).catch(function (e) { S.error = e.message; S.results = null; }).then(function () { S.loading = false; if (ui.screen === 'setup') render(); });
  },
  pickResult: function (d) {
    var S = ui.setup, c = S.results && S.results[+d.i];
    if (!c) return;
    var tees = normTees(c);
    var complete = tees.length && tees.every(function (t) { return t.holes.length; });
    if (complete || c.id == null) { openCourse(c); return; }
    S.loading = true; S.error = ''; render();
    apiGet('/courses/' + encodeURIComponent(c.id)).then(function (data) {
      var full = (data && data.course) || data;
      S.loading = false;
      openCourse(full && typeof full === 'object' && normTees(full).length ? full : c);
    }).catch(function (e) {
      S.loading = false;

      else { S.error = e.message; render(); }
    });
  },
  pickCached: function (d) { var c = db.courses[d.id]; if (c) openCourse(c); },
  manual: function () { var S = ui.setup; S.manualName = ((document.getElementById('manualName') || {}).value || '').trim(); S.course = null; S.tee = null; S.side = '18'; S.step = 'side'; render(); },
  noTees: function () { var S = ui.setup; S.manualName = courseTitle(S.course); S.tee = null; S.step = 'side'; render(); },
  pickTee: function (d) { var S = ui.setup; S.tee = normTees(S.course).filter(function (t) { return t.key === d.k; })[0]; S.side = S.tee && S.tee.holes.length < 18 ? 'front' : '18'; S.step = 'side'; render(); window.scrollTo(0, 0); },
  pickSide: function (d) { ui.setup.side = d.v; render(); },

  reset: function () { var h = curHole(); h.delta = 0; h.on = {}; h.sel = {}; holeChanged(); },

    go('summary', { roundId: r.id, view: 'insights', from: 'home' });
    if (db.settings.gistToken) syncNow(true).then(function () { toast('Round saved and backed up.'); }, function () { toast('Round saved. Backup will retry next sync.'); });
    else toast('Round saved.');
  },
  exitRound: function () { var r = curRound(); if (r && !r.finished) { db.activeId = r.id; save(); go('home'); } else go('summary', { roundId: r.id }); },
  editRound: function () { var r = curRound(); if (!r.finished) db.activeId = r.id; r.cur = 0; save(); go('hole', { roundId: r.id }); },
  deleteRound: function () {
    var r = curRound();
    if (!r || !confirm('Delete this round? This can’t be undone.')) return;
    db.deleted[r.id] = now(); db.rounds = db.rounds.filter(function (x) { return x.id !== r.id; });
    if (db.activeId === r.id) db.activeId = null;
    save(); go('rounds'); toast('Round deleted.');
  },
  view: function (d) { ui.view = d.v; render(); },
  insRange: function (d) { ui.ins.range = d.v === 'all' ? 'all' : +d.v; render(); },
  testKey: function () {
    ui.busy = 'test'; render();
    apiGet('/search?search_query=' + encodeURIComponent('pebble beach')).then(function (data) {
      var n = ((data && data.courses) || []).length; toast(n ? 'Key works.' : 'Key accepted, but the test search returned nothing.');
    }).catch(function (e) { toast(e.message); }).then(function () { ui.busy = false; render(); });
  },
  clearCourses: function () { if (confirm('Clear saved course data? Rounds keep their pars.')) { db.courses = {}; save(); render(); } },
  sync: function () {
    ui.busy = 'sync'; render();
    syncNow(false).catch(function (e) { toast(e.message); }).then(function () { ui.busy = false; render(); });
  },
  export: function () {
    var blob = new Blob([JSON.stringify(portable(), null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'faults-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  import: function () { document.getElementById('importFile').click(); },
  wipe: function () {
    if (!confirm('Delete every round on this device?')) return;
    if (!confirm('Really delete all rounds? If you sync afterwards, they will be removed from your Gist too.')) return;
    db.rounds.forEach(function (r) { db.deleted[r.id] = now(); });
    db.rounds = []; db.activeId = null; save(); render(); toast('All rounds deleted.');
  }
};

/* ---------------- events ---------------- */
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var fn = ACTIONS[b.getAttribute('data-act')];
  if (!fn) return;
  e.preventDefault();
  var ae = document.activeElement;
  if (ae && ae !== b && ae.blur && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) ae.blur();
  try { fn(b.dataset, b); }
  catch (err) { console.error(err); toast('Something went wrong: ' + (err && err.message || err)); }
});
app.addEventListener('change', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-input');
  if (!k) return;
  if (k === 'insCourse') { ui.ins.course = t.value; render(); return; }
  if (k === 'apiKey' || k === 'gistToken' || k === 'gistId') { db.settings[k] = t.value.trim(); save(); render(); }
});
app.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); ACTIONS.search(); }
});
app.addEventListener('input', function (e) {
  if (e.target.id === 'q' && ui.setup) ui.setup.query = e.target.value;
  if (e.target.id === 'manualName' && ui.setup) ui.setup.manualName = e.target.value;
});
function showTip(e) {
  var t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) return;
  var box = document.getElementById(t.getAttribute('data-tipfor'));
  if (box) box.textContent = t.getAttribute('data-tip');
}
app.addEventListener('pointerover', showTip);
app.addEventListener('click', showTip);
document.getElementById('importFile').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try { var before = db.rounds.length; mergeIn(JSON.parse(rd.result)); toast('Imported. ' + db.rounds.length + ' rounds (' + (db.rounds.length - before) + ' new).'); render(); }
    catch (err) { toast(err.message || 'Could not read that file.'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

/* ---------------- render ---------------- */
var SCREENS = { home: screenHome, setup: screenSetup, hole: screenHole, summary: screenSummary, rounds: screenRounds, insights: screenInsights, settings: screenSettings };
function render() {
  var y = window.scrollY;
  app.innerHTML = (SCREENS[ui.screen] || screenHome)();
  window.scrollTo(0, y);
}
render();
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist().catch(function () {}); } catch (e) { /* optional */ } }
window.addEventListener('error', function (e) { toast('Something went wrong: ' + (e.message || 'unknown error')); });
window.addEventListener('unhandledrejection', function (e) { var m = e.reason && e.reason.message; toast('Something went wrong: ' + (m || 'unknown error')); });
window.__faults ={ db: function () { return db; }, ui: ui, ACTIONS: ACTIONS, render: render };
})();
</script>
</body>
</html>
